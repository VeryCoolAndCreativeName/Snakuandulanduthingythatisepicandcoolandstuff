<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Snakes & Ladders</title>

<style>
    body {
        font-family: Arial;
        text-align: center;
        background-color: lightblue; /* CHANGE BACKGROUND HERE */
    }

    #board {
        display: grid;
        grid-template-columns: repeat(5, 80px);
        grid-gap: 5px;
        justify-content: center;
        margin: 20px;
    }

    .square {
        width: 80px;
        height: 80px;
        border: 1px solid black;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        position: relative;
    }

    .player {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        position: absolute;
    }

    #controls {
        margin-top: 20px;
    }
</style>
</head>

<body>

<h1>Snakes & Ladders (Basic Version)</h1>

<!-- BOARD -->
<div id="board"></div>

<!-- CONTROLS -->
<div id="controls">
    <label>Number of Players:</label>
    <input type="number" id="numPlayers" min="1" max="4" value="2">
    <button onclick="setupGame()">Start Game</button>
    <br><br>

    <label>Dice 1:</label>
    <input type="number" id="dice1" min="1" max="6">
    <label>Dice 2:</label>
    <input type="number" id="dice2" min="1" max="6">

    <button onclick="rollDice()">Submit Dice</button>
    <button onclick="resetGame()">Reset</button>

    <p id="status"></p>
</div>

<script>
const maxSquares = 20;
let players = [];
let currentPlayer = 0;

// Colors for players
const colors = ["red", "blue", "green", "purple"];

/*
    CREATE BOARD
    - Generates 20 squares
    - Each square shows its coordinate (number)
*/
function createBoard() {
    const board = document.getElementById("board");
    board.innerHTML = "";

    for (let i = 1; i <= maxSquares; i++) {
        const square = document.createElement("div");
        square.classList.add("square");
        square.id = "sq-" + i;

        // Show coordinate number
        square.innerText = i;

        board.appendChild(square);
    }
}

/*
    SETUP GAME
    - Creates players based on user input
    - Places them at position 1
*/
function setupGame() {
    const num = document.getElementById("numPlayers").value;

    players = [];

    for (let i = 0; i < num; i++) {
        players.push({
            position: 1
        });
    }

    currentPlayer = 0;
    createBoard();
    updatePlayers();
    updateStatus();
}

/*
    UPDATE PLAYER POSITIONS
    - Draws players on board
*/
function updatePlayers() {
    // Clear all player markers
    document.querySelectorAll(".player").forEach(p => p.remove());

    players.forEach((player, index) => {
        const square = document.getElementById("sq-" + player.position);

        const piece = document.createElement("div");
        piece.classList.add("player");
        piece.style.background = colors[index];
        piece.style.top = (index * 15) + "px"; // stack players visually

        square.appendChild(piece);
    });
}

/*
    HANDLE DICE INPUT
    - Randomly generate real dice values
    - User must match BOTH dice correctly to move
*/
function rollDice() {
    const userDice1 = Number(document.getElementById("dice1").value);
    const userDice2 = Number(document.getElementById("dice2").value);

    const realDice1 = Math.floor(Math.random() * 6) + 1;
    const realDice2 = Math.floor(Math.random() * 6) + 1;

    // Check if user guessed correctly
    if (userDice1 === realDice1 && userDice2 === realDice2) {

        let move = realDice1 + realDice2;

        // Move player
        players[currentPlayer].position += move;

        // Prevent going past 20
        if (players[currentPlayer].position > maxSquares) {
            players[currentPlayer].position = maxSquares;
        }

        document.getElementById("status").innerText =
            `Correct! Player ${currentPlayer + 1} moves to square ${players[currentPlayer].position}`;

        // Check win
        if (players[currentPlayer].position === maxSquares) {
            alert(`Player ${currentPlayer + 1} wins!`);
        }

    } else {
        document.getElementById("status").innerText =
            `Wrong! Dice were ${realDice1} and ${realDice2}`;
    }

    // Next player's turn
    currentPlayer = (currentPlayer + 1) % players.length;

    updatePlayers();
    updateStatus();
}

/*
    UPDATE TURN DISPLAY
*/
function updateStatus() {
    document.getElementById("status").innerText +=
        ` | Player ${currentPlayer + 1}'s turn`;
}

/*
    RESET GAME
*/
function resetGame() {
    players = [];
    currentPlayer = 0;
    document.getElementById("board").innerHTML = "";
    document.getElementById("status").innerText = "Game reset!";
}
</script>

</body>
</html>
